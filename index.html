<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#102a56">
<title>일상 퀴즈 레벨업</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172033;background:#f4f7fc}
*{box-sizing:border-box}body{margin:0;padding:18px 14px 36px}
main{max-width:620px;margin:auto}
.hero{background:linear-gradient(135deg,#102a56,#2563eb);color:#fff;padding:24px 20px;border-radius:22px;margin-bottom:16px;box-shadow:0 8px 24px #1e3a8a22}
h1{font-size:24px;margin:0 0 8px}.hero p{margin:0;color:#dbeafe}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:13px}
.stat small{display:block;color:#64748b;font-size:12px}.stat strong{display:block;font-size:18px;margin-top:4px;overflow-wrap:anywhere}
.panel{padding:18px;margin:12px 0}.question{font-size:19px;line-height:1.55;margin:8px 0 16px}
button{font:inherit;border:0;border-radius:13px;padding:14px 16px;font-weight:700;cursor:pointer}
.primary{background:#1d4ed8;color:white;width:100%;margin-top:12px}
.secondary{background:#eaf1ff;color:#1e40af;width:100%;margin-bottom:10px}
.choice{display:block;width:100%;text-align:left;background:#f8fafc;border:1px solid #dbe3ef;margin:8px 0;color:#172033}
.choice.selected{background:#eaf1ff;border:2px solid #2563eb;color:#1e40af;padding:13px 15px}
.choice:disabled{opacity:.48}
.small{color:#64748b;font-size:13px}
.progress{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:#2563eb;width:0}
.feedback{padding:12px;border-radius:12px;margin-top:12px;background:#eff6ff;color:#1e40af}
.feedback.bad{background:#fff1f2;color:#be123c}
.hidden{display:none}
@media(min-width:480px){body{padding-top:28px}.hero{padding:28px}.question{font-size:21px}}
</style>
</head>
<body><main>
<header class="hero"><h1>🎮 일상 퀴즈 레벨업</h1><p>50개의 일상 문제를 풀고 레벨과 랭크를 올려보세요!</p></header>
<section id="stats" class="stats hidden">
<div class="stat"><small>⭐ LEVEL</small><strong id="level">Lv. 1</strong></div>
<div class="stat"><small>✨ EXP</small><strong id="exp">0 / 30</strong></div>
<div class="stat"><small>🔥 COMBO</small><strong id="combo">0</strong></div>
<div class="stat"><small>🪙 COIN</small><strong id="coins">50</strong></div>
<div class="stat" style="grid-column:span 2"><small>🏆 RANK · 🎯 SCORE</small><strong id="rank">BRONZE 🥉 · 0</strong></div>
</section>
<section id="intro" class="panel">
<h2>게임 안내</h2><p>정답을 맞히면 EXP, 점수, 코인을 얻어요.</p>
<p>연속 정답은 콤보 보너스를 줍니다. 힌트는 20코인이 필요해요.</p>
<p class="small">총 50문제 · 랜덤 순서 · 진행 상황은 이 휴대폰에 저장됩니다.</p>
<button class="primary" id="start">게임 시작하기</button>
</section>
<section id="game" class="panel hidden">
<div class="small" id="counter">문제 1 / 50</div><div class="progress"><div id="bar"></div></div>
<h2 id="qnum">📖 문제 1</h2><div class="question" id="question"></div>
<button class="secondary" id="hint">💡 힌트 사용하기 (20 코인)</button>
<div id="choices"></div>
<button class="primary" id="submit" disabled>정답 확인</button>
<div id="feedback" class="feedback hidden"></div>
<button class="primary hidden" id="next">다음 문제로</button>
</section>
<section id="result" class="panel hidden">
<h2>🏁 게임 종료!</h2><h3>최종 결과</h3><div id="summary"></div>
<button class="primary" id="restart">다시 플레이</button>
</section>
<p class="small" style="text-align:center">일상 퀴즈 레벨업 게임 · 오프라인 플레이</p>
</main>
<script>
const QUESTIONS = [{"question": "물을 끓일 때 물의 온도가 계속 올라가다가 끓기 시작하면 어떻게 될까?", "choices": ["계속 빠르게 올라간다", "일정하게 유지되는 동안이 생긴다", "갑자기 0도가 된다", "물이 얼기 시작한다"], "answer": 2}, {"question": "컴퓨터에서 파일을 실수로 삭제했을 때 가장 먼저 확인해볼 곳은?", "choices": ["휴지통", "바탕화면", "인터넷", "키보드"], "answer": 1}, {"question": "엘리베이터를 이용할 때 먼저 해야 하는 행동은?", "choices": ["문을 손으로 막기", "안쪽으로 뛰어가기", "내릴 사람이 먼저 내리도록 기다리기", "버튼을 전부 누르기"], "answer": 3}, {"question": "달력에서 1년은 일반적으로 몇 개월일까?", "choices": ["10개월", "11개월", "12개월", "13개월"], "answer": 3}, {"question": "휴대폰에서 '비행기 모드'를 켜면 주로 제한되는 기능은?", "choices": ["화면 밝기", "일부 무선 통신 기능", "카메라", "계산기"], "answer": 2}, {"question": "아이스크림을 실온에 오래 두면 어떻게 될까?", "choices": ["더 단단해진다", "녹는다", "얼음으로 변한다", "색이 반드시 바뀐다"], "answer": 2}, {"question": "식사를 하기 전에 손을 씻는 가장 중요한 이유는?", "choices": ["손의 세균과 오염을 줄이기 위해", "손을 따뜻하게 하기 위해", "손톱을 길게 하기 위해", "피부색을 바꾸기 위해"], "answer": 1}, {"question": "USB 메모리를 안전하게 제거하는 이유로 가장 적절한 것은?", "choices": ["컴퓨터 화면을 밝게 하려고", "데이터 손상을 줄이려고", "인터넷을 빠르게 하려고", "키보드를 잠그려고"], "answer": 2}, {"question": "아침에 일어나 갑자기 어지러울 때 가장 좋은 행동은?", "choices": ["바로 전력질주하기", "안전한 곳에서 잠시 앉거나 쉬기", "계속 점프하기", "눈을 감고 계단 내려가기"], "answer": 2}, {"question": "냉동식품을 녹인 뒤 다시 얼리는 것을 조심해야 하는 이유는?", "choices": ["포장이 커지기 때문에", "품질과 식품 안전에 문제가 생길 수 있기 때문에", "색깔이 반드시 검게 변하기 때문에", "무게가 두 배가 되기 때문에"], "answer": 2}, {"question": "버스에서 교통카드를 사용하는 목적과 가장 가까운 것은?", "choices": ["요금을 지불하기 위해", "버스 속도를 조절하기 위해", "문을 열기 위해", "좌석을 만드는 기능"], "answer": 1}, {"question": "노트북을 사용할 때 통풍구를 막으면 생길 수 있는 문제는?", "choices": ["기기가 과열될 수 있다", "인터넷이 자동으로 빨라진다", "배터리가 무조건 충전된다", "화면이 커진다"], "answer": 1}, {"question": "공공장소에서 이어폰을 사용할 때 주의할 점은?", "choices": ["주변 소리를 전혀 들을 수 없게 하기", "주변 상황을 확인할 수 있는 정도로 사용하기", "항상 최대 음량으로 듣기", "한쪽 귀를 막고 다른 쪽도 완전히 차단하기"], "answer": 2}, {"question": "신호등에서 초록불이 켜졌더라도 주변을 확인해야 하는 이유는?", "choices": ["차량이나 자전거가 움직일 수 있기 때문에", "신호등이 장식이기 때문에", "도로가 자동으로 움직이기 때문에", "초록색이 위험한 색이기 때문에"], "answer": 1}, {"question": "온라인 계정의 2단계 인증을 사용하는 가장 큰 이유는?", "choices": ["로그인 화면을 예쁘게 만들기 위해", "계정 보안을 강화하기 위
